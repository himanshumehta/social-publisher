# Local development stack. Everything runs in dry-run mode by default:
# no credentials are needed and no platform API is ever called.
name: social-publisher

x-app: &app
  build: .
  image: social-publisher:local
  env_file: .env
  environment: &app-env
    APP_HOST: "0.0.0.0"
    APP_PORT: "8081"
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_ADDR: redis:6379
    # Only used by the video/thumbnail path; start MinIO with --profile storage.
    S3_ENDPOINT: minio:9000
    S3_COLD_ENDPOINT: minio:9000
    PUBLISH_DRY_RUN: ${PUBLISH_DRY_RUN:-true}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-socialpub}
      POSTGRES_USER: ${DB_USER:-socialpub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-socialpub}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies migrations/ then exits.
  migrate:
    <<: *app
    command: ["/app/migrate", "up"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  # HTTP API.
  app:
    <<: *app
    command: ["/app/server"]
    ports:
      - "${API_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Background worker: scheduling, publishing pipeline, upload queue.
  worker:
    <<: *app
    command: ["/app/worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional S3-compatible storage for video uploads / thumbnails:
  #   docker compose --profile storage up -d
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
